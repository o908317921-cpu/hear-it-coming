<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影片逐幀分析</title>
<style>
body{margin:0;padding:16px;background:#0E1416;color:#EEF3F2;font:14px/1.6 system-ui,"Microsoft JhengHei",sans-serif;max-width:900px}
label{display:block;margin:10px 0 4px}input,textarea,button{font:inherit}
textarea{width:100%;height:110px;background:#151C1F;color:#EEF3F2;border:1px solid #2B3035;border-radius:6px;padding:8px}
input[type=number]{width:80px}
button{background:#1F6FEB;color:#fff;border:0;border-radius:6px;padding:8px 16px;margin:12px 8px 0 0;cursor:pointer}
button:disabled{background:#2B3035;color:#98A1A9;cursor:default}
code{background:#151C1F;padding:1px 4px;border-radius:4px}
canvas{max-width:100%;margin-top:12px;border:1px solid #2B3035}
#log{white-space:pre-wrap}
</style>
</head>
<body>
<h1>影片逐幀分析（實驗一、二、三、六用）</h1>
<p>選一段胸前手機錄的影片，用目前手機版的辨識與警報規則<b>一幀一幀</b>跑完，匯出 CSV。時間以影片本身計算，不受電腦快慢影響（離線逐幀處理）。影片沒有陀螺儀資料，鏡頭轉動只用光流估計。</p>
<label for="file">影片檔</label>
<input type="file" id="file" accept="video/*">
<label for="fps">每秒分析幾幀（建議與錄影相同，常見 30）</label>
<input type="number" id="fps" value="30" min="1" max="120">
<label for="tc">真實碰撞時刻（秒，實驗一用，可留空）：側拍算出物體到達鏡頭的時間，填了會算 TTC 平均絕對誤差（只算真實 TTC ≤ 3 秒的幀）</label>
<input type="number" id="tc" step="0.01" min="0">
<label><input type="checkbox" id="depth"> 同時跑深度模型（頭上障礙、地面高低差、斑馬線；較慢）</label>
<label for="over">設定覆寫（JSON，可留空）。例：消融 <code>{"ABLATE_TRACKER":true}</code>、<code>{"ABLATE_LANDING":true}</code>、<code>{"ABLATE_GMC":true}</code>、移除陀螺儀 <code>{"CAMERA_MOTION_MODE":"flow"}</code>；實驗六 <code>{"INFERENCE_SIZE":448}</code>、<code>{"DETECTION_INTERVAL":3}</code>、分割模型 <code>{"MODEL_URL":"../models/yolo11n-seg.onnx","INFERENCE_SIZE":448}</code></label>
<textarea id="over" spellcheck="false"></textarea>
<div>
<button id="run" disabled>開始分析</button>
<button id="stop" disabled>停止</button>
<button id="dlTracks" disabled>下載 每幀物體.csv</button>
<button id="dlAlerts" disabled>下載 警報.csv</button>
</div>
<div id="log">載入中…</div>
<canvas id="view"></canvas>
<script type="module" src="video.js"></script>
</body>
</html>
